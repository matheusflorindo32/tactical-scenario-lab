name: one-time nanoid lock remediation

on:
  push:
    branches: [fix/vercel-container-deploy]
    paths: [.github/workflows/remediate-nanoid-lock.yml]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/vercel-container-deploy
          persist-credentials: true
      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Update only the transitive nanoid lock resolution
        run: npm update nanoid --package-lock-only
      - name: Verify high-severity audit is clean
        run: npm audit --audit-level=high
      - name: Verify clean install and frontend build
        run: |
          npm ci
          npm run build
      - name: Commit generated lockfile only
        run: |
          git diff -- package-lock.json
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M package-lock.json$' || true)"
          if git diff --quiet -- package-lock.json; then
            echo 'No package-lock.json change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: update nanoid lock resolution to 3.3.18'
          git push origin HEAD:fix/vercel-container-deploy
