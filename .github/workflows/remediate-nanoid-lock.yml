name: one-time nanoid lock remediation

on:
  push:
    branches: [fix/vercel-container-deploy]
    paths: [.github/workflows/remediate-nanoid-lock.yml]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/vercel-container-deploy
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Restore main lockfile and patch only nanoid 3.3.17 to 3.3.18
        shell: bash
        run: |
          git show origin/main:package-lock.json > package-lock.json
          python3 - <<'PY'
          from pathlib import Path

          path = Path('package-lock.json')
          text = path.read_text()
          replacements = {
              '"version": "3.3.17"': '"version": "3.3.18"',
              'https://registry.npmjs.org/nanoid/-/nanoid-3.3.17.tgz': 'https://registry.npmjs.org/nanoid/-/nanoid-3.3.18.tgz',
              'sha512-xQLf0A3HOMlgHq0n247/LRuAOYmB7dXJ/DvAxGvsSBij45XtBSmQycu+F8ODbHwns/XyFZagyL1+J0Offw1E0g==': 'sha512-DTg4MJbGMWkfi6VZFdNt2/caMbQy4Ou+Op/hJQvGEWcnVfoA1QA+xzRKAzw9jD6+GVOOeYr/mIcuDSdug6F6+w==',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Verify PR lock diff is nanoid-only
        run: |
          git diff origin/main -- package-lock.json
          changed=$(git diff --numstat origin/main -- package-lock.json | awk '{print $1+$2}')
          test "$changed" -eq 6
          test "$(git diff origin/main -- package-lock.json | grep -c '^[-+].*3\.3\.1[78]')" -eq 4
      - name: Verify clean install, audit, and frontend build
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Commit exact minimal lockfile
        run: |
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M package-lock.json$' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: minimally patch nanoid lock to 3.3.18'
          git push origin HEAD:fix/vercel-container-deploy
