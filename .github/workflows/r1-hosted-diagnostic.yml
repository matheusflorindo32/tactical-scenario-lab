name: tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: read
  id-token: write

jobs:
  protected-preview-diagnostic:
    name: R1 protected Preview diagnostic
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R1_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Resolve exact Vercel deployment
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment_url=""

          for attempt in $(seq 1 90); do
            deployments="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${R1_HEAD_SHA}&per_page=100")"

            while read -r candidate_id; do
              [ -n "$candidate_id" ] || continue
              statuses="$(curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${candidate_id}/statuses?per_page=100")"
              state="$(jq -r '.[0].state // empty' <<<"$statuses")"
              candidate_url="$(jq -r '.[0].environment_url // .[0].target_url // empty' <<<"$statuses")"

              if [ "$state" = "success" ] && [[ "$candidate_url" == https://*.vercel.app* ]]; then
                deployment_url="$candidate_url"
                break 2
              fi
            done < <(jq -r '.[].id' <<<"$deployments")

            sleep 2
          done

          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Resolved exact Preview for $R1_HEAD_SHA."

      - name: Mint fresh token for liveness
        id: live_token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Probe liveness with fresh token
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment_url }}
          OIDC_TOKEN: ${{ steps.live_token.outputs.token }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          status="$(curl --silent --show-error --max-time 20 \
            --output /tmp/live.json --write-out '%{http_code}' \
            -H "x-vercel-trusted-oidc-idp-token: ${OIDC_TOKEN}" \
            "$base/health/live" || true)"
          body="$(cat /tmp/live.json 2>/dev/null || true)"
          echo "fresh-live status=$status body=$body"

      - name: Mint fresh token for readiness
        id: ready_token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Probe readiness with fresh token
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment_url }}
          OIDC_TOKEN: ${{ steps.ready_token.outputs.token }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          status="$(curl --silent --show-error --max-time 20 \
            --output /tmp/ready.json --write-out '%{http_code}' \
            -H "x-vercel-trusted-oidc-idp-token: ${OIDC_TOKEN}" \
            "$base/health/ready" || true)"
          body="$(cat /tmp/ready.json 2>/dev/null || true)"
          echo "fresh-ready status=$status body=$body"

      - name: Mint fresh token for root
        id: root_token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Probe root with fresh token
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment_url }}
          OIDC_TOKEN: ${{ steps.root_token.outputs.token }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          status="$(curl --silent --show-error --max-time 20 \
            --output /tmp/root.html --write-out '%{http_code}' \
            -H "x-vercel-trusted-oidc-idp-token: ${OIDC_TOKEN}" \
            "$base/" || true)"
          echo "fresh-root status=$status bytes=$(wc -c < /tmp/root.html 2>/dev/null || echo 0)"

      - name: Mint token for explicit replay probe
        id: replay_token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Probe same-token replay behavior
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment_url }}
          OIDC_TOKEN: ${{ steps.replay_token.outputs.token }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          first="$(curl --silent --show-error --max-time 20 \
            --output /tmp/replay-first.json --write-out '%{http_code}' \
            -H "x-vercel-trusted-oidc-idp-token: ${OIDC_TOKEN}" \
            "$base/health/live" || true)"
          second="$(curl --silent --show-error --max-time 20 \
            --output /tmp/replay-second.json --write-out '%{http_code}' \
            -H "x-vercel-trusted-oidc-idp-token: ${OIDC_TOKEN}" \
            "$base/health/live" || true)"
          first_body="$(cat /tmp/replay-first.json 2>/dev/null || true)"
          second_body="$(cat /tmp/replay-second.json 2>/dev/null || true)"
          echo "same-token first=$first body=$first_body"
          echo "same-token second=$second body=$second_body"
