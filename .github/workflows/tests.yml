name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: read

jobs:
  security-audit:
    name: Security — Composer and npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Composer security audit
        run: composer audit --locked
        env:
          COMPOSER_NO_AUDIT: 0

      - name: Install frontend dependencies
        run: npm ci

      - name: npm high severity security audit
        run: npm audit --audit-level=high

  container-build:
    name: Container — build and runtime contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build release container
        run: docker build --tag tactical-scenario-lab:ci .

      - name: Verify PostgreSQL extension
        run: docker run --rm tactical-scenario-lab:ci php -m | grep -q pdo_pgsql

      - name: Verify non-root runtime
        run: docker run --rm tactical-scenario-lab:ci sh -lc 'test "$(id -u)" -ne 0'

      - name: Verify built frontend assets
        run: docker run --rm tactical-scenario-lab:ci sh -lc 'test -f public/build/manifest.json'

  phpunit:
    name: PHPUnit — PHP 8.4 / SQLite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, openssl, tokenizer, xml, ctype, json
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

      - name: Generate application key
        run: php artisan key:generate

      - name: Verify Laravel release cacheability
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan config:clear
          php artisan route:clear

      - name: Rebuild database from migrations
        run: php artisan migrate:fresh --force

      - name: Run tests
        run: php artisan test

  phpunit-postgres:
    name: PHPUnit — PHP 8.4 / PostgreSQL 16
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tactical_scenario_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tactical_scenario_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: tactical_scenario_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      PII_FINGERPRINT_KEY: ci-only-m6-fingerprint-key-not-for-production
      M6_RUNTIME_DB_USERNAME: tactical_runtime_test
      M6_RUNTIME_DB_PASSWORD: runtime-test-only

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, openssl, tokenizer, xml, ctype, json
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

      - name: Generate application key
        run: php artisan key:generate

      - name: Verify Laravel release cacheability
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan config:clear
          php artisan route:clear

      - name: Rebuild PostgreSQL database from migrations
        run: php artisan migrate:fresh --force

      - name: Provision least-privilege runtime role
        run: |
          PGPASSWORD="$DB_PASSWORD" psql \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --username="$DB_USERNAME" \
            --dbname="$DB_DATABASE" \
            --set=ON_ERROR_STOP=1 <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE tactical_runtime_test LOGIN PASSWORD 'runtime-test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          GRANT CONNECT ON DATABASE tactical_scenario_test TO tactical_runtime_test;
          GRANT USAGE ON SCHEMA public TO tactical_runtime_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO tactical_runtime_test;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO tactical_runtime_test;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO tactical_runtime_test;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO tactical_runtime_test;
          SQL

      - name: Verify M6 migration rollback and reapply
        run: |
          php artisan migrate:rollback --path=database/migrations/2026_08_08_161000_add_m6_postgresql_immutability_guards.php --force
          php artisan migrate:rollback --path=database/migrations/2026_08_08_160000_add_m6_structural_integrity.php --force
          php artisan migrate --path=database/migrations/2026_08_08_160000_add_m6_structural_integrity.php --force
          php artisan migrate --path=database/migrations/2026_08_08_161000_add_m6_postgresql_immutability_guards.php --force

      - name: Repeat M6 concurrency invariants
        run: |
          for attempt in 1 2 3; do
            echo "M6 concurrency attempt ${attempt}/3"
            php artisan test tests/Feature/PostgresConcurrencyTest.php
          done

      - name: Run tests on PostgreSQL
        run: php artisan test

  browser-smoke:
    name: Browser smoke — Chromium + Firefox
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      PII_FINGERPRINT_KEY: ci-browser-only-fingerprint-key-not-for-production
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, openssl, tokenizer, xml, ctype, json
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.0

      - name: Audit browser runner dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Prepare disposable browser-test application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          printf '\nAPP_ENV=testing\nAPP_DEBUG=false\nAPP_URL=http://127.0.0.1:8000\nDB_CONNECTION=sqlite\nDB_DATABASE=%s/database/database.sqlite\nPII_FINGERPRINT_KEY=ci-browser-only-fingerprint-key-not-for-production\n' "$GITHUB_WORKSPACE" >> .env
          php artisan key:generate
          php artisan migrate:fresh --force
          php artisan db:seed --class=R1BrowserSeeder --force

      - name: Start Laravel test server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/browser-server.log 2>&1 &
          echo $! > /tmp/tactical-browser-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/browser-server.log
          exit 1

      - name: Verify local health probes
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health/live
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready

      - name: Run authenticated browser smoke
        run: npx playwright test

      - name: Show Laravel server log on failure
        if: failure()
        run: cat storage/logs/browser-server.log || true

  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

  hosted-preview-admission:
    name: Hosted Preview — exact deployment admission
    runs-on: ubuntu-latest
    needs:
      - security-audit
      - container-build
      - phpunit
      - phpunit-postgres
      - browser-smoke
      - lint

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R1_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Resolve exact Vercel deployment for pull request HEAD
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${R1_HEAD_SHA:-}"

          deployment_id=""
          deployment_url=""

          for attempt in $(seq 1 90); do
            deployments="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${R1_HEAD_SHA}&per_page=100")"

            while read -r candidate_id; do
              [ -n "$candidate_id" ] || continue

              statuses="$(curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${candidate_id}/statuses?per_page=100")"

              state="$(jq -r '.[0].state // empty' <<<"$statuses")"
              candidate_url="$(jq -r '.[0].environment_url // .[0].target_url // empty' <<<"$statuses")"

              if [ "$state" = "success" ] && [[ "$candidate_url" == https://*.vercel.app* ]]; then
                deployment_id="$candidate_id"
                deployment_url="$candidate_url"
                break 2
              fi
            done < <(jq -r '.[].id' <<<"$deployments")

            sleep 2
          done

          if [ -z "$deployment_id" ] || [ -z "$deployment_url" ]; then
            echo "No successful Vercel deployment was resolved for exact PR HEAD $R1_HEAD_SHA."
            exit 1
          fi

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Exact Vercel deployment resolved for PR HEAD $R1_HEAD_SHA."

      - name: Detect automation bypass configuration
        id: bypass
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_AUTOMATION_BYPASS_SECRET is not configured; protected hosted health admission remains pending."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Verify protected Preview health admission
        if: steps.bypass.outputs.configured == 'true'
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment_url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"

          live_body="$(curl --fail --silent --show-error \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            -H 'x-vercel-set-bypass-cookie: true' \
            "$base/health/live")"

          ready_body="$(curl --fail --silent --show-error \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            -H 'x-vercel-set-bypass-cookie: true' \
            "$base/health/ready")"

          root_status="$(curl --silent --show-error --output /tmp/r1-root.html --write-out '%{http_code}' \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            -H 'x-vercel-set-bypass-cookie: true' \
            "$base/")"

          test "$live_body" = '{"status":"ok"}'
          php -r '$payload=json_decode($argv[1], true, 512, JSON_THROW_ON_ERROR); exit((($payload["status"] ?? null) === "ready" && ($payload["database"] ?? null) === "ok") ? 0 : 1);' "$ready_body"
          test "$root_status" = "200"

          echo "Protected liveness, readiness and root admission passed for exact PR HEAD $R1_HEAD_SHA."

      - name: Sustained readiness observation window
        if: steps.bypass.outputs.configured == 'true'
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment_url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"

          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output /tmp/r1-ready.json --write-out '%{http_code}' \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              -H 'x-vercel-set-bypass-cookie: true' \
              "$base/health/ready")"

            if [ "$status" != "200" ]; then
              echo "Readiness failed during observation window at attempt $attempt with HTTP $status."
              cat /tmp/r1-ready.json
              exit 1
            fi

            php -r '$payload=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); exit((($payload["status"] ?? null) === "ready" && ($payload["database"] ?? null) === "ok") ? 0 : 1);' /tmp/r1-ready.json
            sleep 1
          done

          echo "Sustained readiness observation window completed for exact PR HEAD $R1_HEAD_SHA."
