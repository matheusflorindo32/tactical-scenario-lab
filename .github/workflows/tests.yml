name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-audit:
    name: Security — Composer and npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Composer security audit
        run: composer audit --locked
        env:
          COMPOSER_NO_AUDIT: 0

      - name: Install frontend dependencies
        run: npm ci

      - name: npm high severity security audit
        run: npm audit --audit-level=high

  container-build:
    name: Container — build and runtime contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build release container
        run: docker build --tag tactical-scenario-lab:ci .

      - name: Verify PostgreSQL extension
        run: docker run --rm tactical-scenario-lab:ci php -m | grep -q pdo_pgsql

      - name: Verify non-root runtime
        run: docker run --rm tactical-scenario-lab:ci sh -lc 'test "$(id -u)" -ne 0'

      - name: Verify built frontend assets
        run: docker run --rm tactical-scenario-lab:ci sh -lc 'test -f public/build/manifest.json'

  phpunit:
    name: PHPUnit — PHP 8.4 / SQLite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, openssl, tokenizer, xml, ctype, json
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

      - name: Generate application key
        run: php artisan key:generate

      - name: Verify Laravel release cacheability
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan config:clear
          php artisan route:clear

      - name: Rebuild database from migrations
        run: php artisan migrate:fresh --force

      - name: Run tests
        run: php artisan test

  phpunit-postgres:
    name: PHPUnit — PHP 8.4 / PostgreSQL 16
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tactical_scenario_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tactical_scenario_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: tactical_scenario_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      PII_FINGERPRINT_KEY: ci-only-m6-fingerprint-key-not-for-production
      M6_RUNTIME_DB_USERNAME: tactical_runtime_test
      M6_RUNTIME_DB_PASSWORD: runtime-test-only

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, openssl, tokenizer, xml, ctype, json
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

      - name: Generate application key
        run: php artisan key:generate

      - name: Verify Laravel release cacheability
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan config:clear
          php artisan route:clear

      - name: Rebuild PostgreSQL database from migrations
        run: php artisan migrate:fresh --force

      - name: Provision least-privilege runtime role
        run: |
          PGPASSWORD="$DB_PASSWORD" psql \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --username="$DB_USERNAME" \
            --dbname="$DB_DATABASE" \
            --set=ON_ERROR_STOP=1 <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE tactical_runtime_test LOGIN PASSWORD 'runtime-test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          GRANT CONNECT ON DATABASE tactical_scenario_test TO tactical_runtime_test;
          GRANT USAGE ON SCHEMA public TO tactical_runtime_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO tactical_runtime_test;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO tactical_runtime_test;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO tactical_runtime_test;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO tactical_runtime_test;
          SQL

      - name: Verify M6 migration rollback and reapply
        run: |
          php artisan migrate:rollback --path=database/migrations/2026_08_08_161000_add_m6_postgresql_immutability_guards.php --force
          php artisan migrate:rollback --path=database/migrations/2026_08_08_160000_add_m6_structural_integrity.php --force
          php artisan migrate --path=database/migrations/2026_08_08_160000_add_m6_structural_integrity.php --force
          php artisan migrate --path=database/migrations/2026_08_08_161000_add_m6_postgresql_immutability_guards.php --force

      - name: Repeat M6 concurrency invariants
        run: |
          for attempt in $(seq 1 3); do
            echo "M6 concurrency attempt ${attempt}/3"
            php artisan test tests/Feature/PostgresConcurrencyTest.php
          done

      - name: Run tests on PostgreSQL
        run: php artisan test

  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

  hosted-preview-admission:
    name: Hosted Preview — OIDC exact deployment admission
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - security-audit
      - container-build
      - phpunit
      - phpunit-postgres
      - lint

    permissions:
      contents: read
      deployments: read
      id-token: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Resolve exact Vercel deployment for pull request HEAD
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CANDIDATE_SHA:-}"

          deployment_id=""
          deployment_url=""

          for attempt in $(seq 1 90); do
            deployments="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${CANDIDATE_SHA}&per_page=100")"

            while read -r candidate_id; do
              [ -n "$candidate_id" ] || continue

              statuses="$(curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${candidate_id}/statuses?per_page=100")"

              state="$(jq -r '.[0].state // empty' <<<"$statuses")"
              candidate_url="$(jq -r '.[0].environment_url // .[0].target_url // empty' <<<"$statuses")"

              if [ "$state" = "success" ] && [[ "$candidate_url" == https://*.vercel.app* ]]; then
                deployment_id="$candidate_id"
                deployment_url="$candidate_url"
                break 2
              fi
            done < <(jq -r '.[].id' <<<"$deployments")

            sleep 2
          done

          if [ -z "$deployment_id" ] || [ -z "$deployment_url" ]; then
            echo "::error::No successful Vercel deployment was resolved for exact PR HEAD ${CANDIDATE_SHA}."
            exit 1
          fi

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Exact Vercel deployment resolved for PR HEAD ${CANDIDATE_SHA}."

      - name: Mint GitHub OIDC token for Vercel Trusted Source
        id: oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Verify OIDC protected Preview admission
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment_url }}
          TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          auth_header="x-vercel-trusted-oidc-idp-token: ${TRUSTED_OIDC_TOKEN}"

          live_body="$(curl --fail --silent --show-error --max-time 20 -H "$auth_header" "$base/health/live")"
          ready_body="$(curl --fail --silent --show-error --max-time 20 -H "$auth_header" "$base/health/ready")"
          test "$live_body" = '{"status":"ok"}'
          php -r '$payload=json_decode($argv[1], true, 512, JSON_THROW_ON_ERROR); exit((($payload["status"] ?? null) === "ready" && ($payload["database"] ?? null) === "ok") ? 0 : 1);' "$ready_body"

          root_status="$(curl --silent --show-error --max-time 20 --dump-header /tmp/root.headers --output /tmp/root.html --write-out '%{http_code}' -H "$auth_header" "$base/")"
          test "$root_status" = "200"

          login_status="$(curl --silent --show-error --max-time 20 --dump-header /tmp/login.headers --output /tmp/login.html --write-out '%{http_code}' -H "$auth_header" "$base/login")"
          test "$login_status" = "200"
          grep -Eq 'name=["'"']_token["'"']' /tmp/login.html

          python - <<'PY'
          from pathlib import Path
          import sys

          lines = Path('/tmp/login.headers').read_text(errors='replace').splitlines()
          cookies = []
          for line in lines:
              if not line.lower().startswith('set-cookie:'):
                  continue
              raw = line.split(':', 1)[1].strip()
              name = raw.split('=', 1)[0].strip()
              lower = raw.lower()
              cookies.append({
                  'name': name,
                  'secure': '; secure' in lower or lower.endswith('secure'),
                  'httponly': '; httponly' in lower or lower.endswith('httponly'),
                  'samesite_lax': 'samesite=lax' in lower,
              })

          print(f'::notice::set_cookie_header_count={len(cookies)}')
          for cookie in cookies:
              print(
                  '::notice::cookie_name={name} secure={secure} httponly={httponly} samesite_lax={samesite_lax}'.format(
                      name=cookie['name'],
                      secure=str(cookie['secure']).lower(),
                      httponly=str(cookie['httponly']).lower(),
                      samesite_lax=str(cookie['samesite_lax']).lower(),
                  )
              )

          session_candidates = [c for c in cookies if 'session' in c['name'].lower()]
          passed = any(c['secure'] and c['httponly'] and c['samesite_lax'] for c in session_candidates)
          if not passed:
              print('::error::No session cookie satisfied Secure + HttpOnly + SameSite=Lax.')
              sys.exit(1)
          PY

          dashboard_status="$(curl --silent --show-error --max-time 20 --dump-header /tmp/dashboard.headers --output /tmp/dashboard.html --write-out '%{http_code}' -H "$auth_header" "$base/dashboard")"
          test "$dashboard_status" = "302"
          dashboard_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' /tmp/dashboard.headers)"
          case "$dashboard_location" in
            *'/login'*) ;;
            *) echo "::error::Unauthenticated dashboard did not redirect to login."; exit 1 ;;
          esac

          asset_url="$(grep -oE '(src|href)="[^"]*/build/assets/[^"]+"' /tmp/root.html | head -n1 | sed -E 's/^(src|href)="([^"]+)"$/\2/')"
          test -n "$asset_url"
          case "$asset_url" in
            https://*) full_asset_url="$asset_url" ;;
            /*) full_asset_url="${base}${asset_url}" ;;
            *) full_asset_url="${base}/${asset_url}" ;;
          esac
          asset_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' -H "$auth_header" "$full_asset_url")"
          test "$asset_status" = "200"

          echo "OIDC admitted liveness, readiness, root, login, session-cookie contract, auth boundary, and a built asset for exact PR HEAD ${CANDIDATE_SHA}."

      - name: Sustained readiness observation window
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment_url }}
          TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          auth_header="x-vercel-trusted-oidc-idp-token: ${TRUSTED_OIDC_TOKEN}"

          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --max-time 20 --output /tmp/ready.json --write-out '%{http_code}' -H "$auth_header" "$base/health/ready")"
            if [ "$status" != "200" ]; then
              echo "::error::Readiness failed at attempt ${attempt} with HTTP ${status}."
              exit 1
            fi
            php -r '$payload=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); exit((($payload["status"] ?? null) === "ready" && ($payload["database"] ?? null) === "ok") ? 0 : 1);' /tmp/ready.json
            sleep 1
          done

          echo "Sustained readiness observation completed for exact PR HEAD ${CANDIDATE_SHA}."
