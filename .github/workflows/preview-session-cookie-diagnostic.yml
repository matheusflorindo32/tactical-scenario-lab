name: Preview Session Cookie Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-preview-session-cookie:
    name: Diagnose Preview session cookie attributes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Resolve exact Vercel deployment
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment_url=""
          for attempt in $(seq 1 90); do
            deployments="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${CANDIDATE_SHA}&per_page=100")"
            while read -r candidate_id; do
              [ -n "$candidate_id" ] || continue
              statuses="$(curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${candidate_id}/statuses?per_page=100")"
              state="$(jq -r '.[0].state // empty' <<<"$statuses")"
              candidate_url="$(jq -r '.[0].environment_url // .[0].target_url // empty' <<<"$statuses")"
              if [ "$state" = "success" ] && [[ "$candidate_url" == https://*.vercel.app* ]]; then
                deployment_url="$candidate_url"
                break 2
              fi
            done < <(jq -r '.[].id' <<<"$deployments")
            sleep 2
          done
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub OIDC token
        id: oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Report session cookie attribute booleans only
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment_url }}
          TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          auth_header="x-vercel-trusted-oidc-idp-token: ${TRUSTED_OIDC_TOKEN}"
          status="$(curl --silent --show-error --max-time 20 --dump-header /tmp/login.headers --output /dev/null --write-out '%{http_code}' -H "$auth_header" "$base/login")"
          test "$status" = "200"

          awk '
            BEGIN { found=0; secure=0; httponly=0; samesite=0 }
            {
              lower=tolower($0)
              if (lower ~ /^set-cookie:/ && lower ~ /-session=/) {
                found=1
                if (lower ~ /(^|;[[:space:]]*)secure([;[:space:]]|$)/) secure=1
                if (lower ~ /(^|;[[:space:]]*)httponly([;[:space:]]|$)/) httponly=1
                if (lower ~ /samesite=lax/) samesite=1
              }
            }
            END {
              printf("session_cookie_found=%s\n", found ? "true" : "false")
              printf("secure=%s\n", secure ? "true" : "false")
              printf("httponly=%s\n", httponly ? "true" : "false")
              printf("samesite_lax=%s\n", samesite ? "true" : "false")
              exit found ? 0 : 1
            }
          ' /tmp/login.headers
