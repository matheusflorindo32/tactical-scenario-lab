name: m6-pint-diagnostic

on:
  pull_request:
    branches:
      - main

jobs:
  pint-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Capture formatter diff
        run: |
          vendor/bin/pint database/migrations/2026_08_08_161000_add_m6_postgresql_immutability_guards.php tests/Feature/ExecutiveDashboardTest.php tests/Feature/PostgresImmutabilityTest.php
          git diff -- database/migrations/2026_08_08_161000_add_m6_postgresql_immutability_guards.php tests/Feature/ExecutiveDashboardTest.php tests/Feature/PostgresImmutabilityTest.php
