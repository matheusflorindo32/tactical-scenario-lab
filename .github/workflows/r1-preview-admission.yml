name: R1 hosted Preview admission

on:
  deployment_status:

permissions:
  contents: read

jobs:
  preview-admission:
    name: Hosted Preview — protected health admission
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.ref == 'feature/r1-production-operational-validation'
    runs-on: ubuntu-latest

    env:
      DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
      DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
      DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Record exact deployment identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOYMENT_URL:-}"
          test -n "${DEPLOYMENT_SHA:-}"
          test "$DEPLOYMENT_REF" = "feature/r1-production-operational-validation"
          echo "Deployment SHA: $DEPLOYMENT_SHA"
          echo "Deployment ref: $DEPLOYMENT_REF"
          echo "Deployment URL is present and will be probed without printing credentials."

      - name: Detect automation bypass configuration
        id: bypass
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_AUTOMATION_BYPASS_SECRET is not configured; protected hosted admission remains pending."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Verify protected Preview health admission
        if: steps.bypass.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"

          live_body="$(curl --fail --silent --show-error \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            -H "x-vercel-set-bypass-cookie: true" \
            "$base/health/live")"

          ready_body="$(curl --fail --silent --show-error \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            -H "x-vercel-set-bypass-cookie: true" \
            "$base/health/ready")"

          root_status="$(curl --silent --show-error --output /tmp/r1-root.html --write-out '%{http_code}' \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            -H "x-vercel-set-bypass-cookie: true" \
            "$base/")"

          test "$live_body" = '{"status":"ok"}'
          php -r '$payload=json_decode($argv[1], true, 512, JSON_THROW_ON_ERROR); exit((($payload["status"] ?? null) === "ready" && ($payload["database"] ?? null) === "ok") ? 0 : 1);' "$ready_body"
          test "$root_status" = "200"

          echo "Protected liveness, readiness and root admission passed for $DEPLOYMENT_SHA."

      - name: Sustained readiness observation window
        if: steps.bypass.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"

          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output /tmp/r1-ready.json --write-out '%{http_code}' \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              -H "x-vercel-set-bypass-cookie: true" \
              "$base/health/ready")"

            if [ "$status" != "200" ]; then
              echo "Readiness failed during observation window at attempt $attempt with HTTP $status."
              cat /tmp/r1-ready.json
              exit 1
            fi

            php -r '$payload=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); exit((($payload["status"] ?? null) === "ready" && ($payload["database"] ?? null) === "ok") ? 0 : 1);' /tmp/r1-ready.json
            sleep 1
          done

          echo "Sustained readiness observation window completed for $DEPLOYMENT_SHA."
